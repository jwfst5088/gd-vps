<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <script>
      (function(){
        console.log('[learn-ui] init');

        var learnPanel = null;
        var statusInterval = null;
        var currentMode = 'selfplay';
        var currentAiType = 'advanced-bot';
        var lobbyInterval = null;

        function createLearnPanel() {
          if (learnPanel && learnPanel.parentNode) return;

          learnPanel = document.createElement('div');
          learnPanel.id = 'ai-learn-panel';
          learnPanel.style.cssText = `
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: linear-gradient(180deg, rgba(21,90,68,0.95) 0%, rgba(14,61,46,0.97) 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            z-index: 9999;
            border-top: 1px solid rgba(200,150,46,0.2);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            font-size: 12px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
          `;

          learnPanel.innerHTML = `
            <span style="color:#f0d060;font-weight:700;white-space:nowrap;font-size:13px;">🤖 AI学习</span>

            <div style="display:flex;gap:3px;background:rgba(255,255,255,0.08);border-radius:5px;padding:2px;">
              <button id="mode-selfplay" style="padding:3px 8px;border:none;border-radius:3px;background:rgba(200,150,46,0.25);color:#f0d060;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;">自对弈</button>
              <button id="mode-genetic" style="padding:3px 8px;border:none;border-radius:3px;background:transparent;color:rgba(255,255,255,0.5);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;">遗传算法</button>
              <button id="mode-record" style="padding:3px 8px;border:none;border-radius:3px;background:transparent;color:rgba(255,255,255,0.5);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;">真人对局</button>
            </div>

            <div style="display:flex;gap:3px;background:rgba(255,255,255,0.08);border-radius:5px;padding:2px;margin-top:3px;">
              <button id="ai-advanced" style="padding:3px 8px;border:none;border-radius:3px;background:rgba(59,130,246,0.25);color:#3b82f6;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;">高级AI</button>
            </div>

            <span id="learn-status" style="color:rgba(255,255,255,0.55);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">点击开始训练 AI</span>

            <div id="learn-progress" style="display:none;flex:0 0 100px;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden;">
              <div id="progress-bar" style="height:100%;background:linear-gradient(90deg,#f0d060,#c8962e);width:0%;transition:width 0.5s ease-out;"></div>
            </div>
            <span id="progress-text" style="display:none;color:#f0d060;font-size:11px;white-space:nowrap;">0%</span>

            <span id="iter-info" style="display:none;color:rgba(255,255,255,0.7);font-size:11px;white-space:nowrap;">0/0</span>
            <span id="score-info" style="display:none;color:#f0d060;font-size:11px;white-space:nowrap;">0.0000</span>
            <span id="best-info" style="display:none;color:#f0d060;font-size:11px;white-space:nowrap;">0.0000</span>
            <span id="time-info" style="display:none;color:rgba(255,255,255,0.7);font-size:11px;white-space:nowrap;">0s</span>

            <button id="learn-btn" style="padding:4px 12px;border:none;border-radius:5px;background:linear-gradient(180deg,#f0d060,#c8962e);color:#2a1a00;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;box-shadow:0 1px 6px rgba(200,150,46,0.3);">开始训练</button>
            <button id="stop-btn" style="padding:4px 12px;border:1px solid rgba(232,68,78,0.4);border-radius:5px;background:rgba(204,34,51,0.15);color:#e8444e;font-weight:600;cursor:pointer;font-size:12px;white-space:nowrap;">停止</button>

            <button id="learn-close-btn" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;flex-shrink:0;">&times;</button>
          `;

          document.body.appendChild(learnPanel);

          // Bind event listeners via JS (not inline onclick)
          document.getElementById('learn-close-btn').addEventListener('click', closeLearnPanel);
          document.getElementById('learn-btn').addEventListener('click', startLearning);
          document.getElementById('stop-btn').addEventListener('click', stopLearning);
          document.getElementById('mode-selfplay').addEventListener('click', function(){ setMode('selfplay'); });
          document.getElementById('mode-genetic').addEventListener('click', function(){ setMode('genetic'); });
          document.getElementById('mode-record').addEventListener('click', function(){ setMode('record'); });
          document.getElementById('ai-advanced').addEventListener('click', function(){ setAiType('advanced-bot'); });

          // Restore training state if a task was running before refresh
          restoreTrainingState();
        }

        function setMode(mode) {
          currentMode = mode;
          var selfplayBtn = document.getElementById('mode-selfplay');
          var geneticBtn = document.getElementById('mode-genetic');
          var recordBtn = document.getElementById('mode-record');

          if (!selfplayBtn || !geneticBtn || !recordBtn) return;

          selfplayBtn.style.background = 'transparent';
          selfplayBtn.style.color = 'rgba(255,255,255,0.5)';
          geneticBtn.style.background = 'transparent';
          geneticBtn.style.color = 'rgba(255,255,255,0.5)';
          recordBtn.style.background = 'transparent';
          recordBtn.style.color = 'rgba(255,255,255,0.5)';

          var st = document.getElementById('learn-status');

          if (mode === 'selfplay') {
            selfplayBtn.style.background = 'rgba(200,150,46,0.25)';
            selfplayBtn.style.color = '#f0d060';
            if (st) st.textContent = 'AI 自对弈训练模式';
          } else if (mode === 'genetic') {
            geneticBtn.style.background = 'rgba(168,85,247,0.25)';
            geneticBtn.style.color = '#a855f7';
            if (st) st.textContent = '遗传算法优化模式';
          } else {
            recordBtn.style.background = 'rgba(42,111,196,0.25)';
            recordBtn.style.color = '#4a8fe4';
            if (st) st.textContent = '从真人对局记录学习';
          }
        }

        function setAiType(type) {
          currentAiType = type;
          var advBtn = document.getElementById('ai-advanced');
          if (!advBtn) return;
          if (type === 'advanced-bot') {
            advBtn.style.background = 'rgba(59,130,246,0.25)';
            advBtn.style.color = '#3b82f6';
          }
        }

        function closeLearnPanel() {
          if (learnPanel && learnPanel.parentNode) {
            learnPanel.parentNode.removeChild(learnPanel);
            learnPanel = null;
          }
          if (statusInterval) {
            clearInterval(statusInterval);
            statusInterval = null;
          }
        }

        function restoreTrainingState() {
          fetch('/api/v1/learn/status')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data.isRunning) return;
            console.log('[learn-ui] Restoring running training task');

            var statusEl = document.getElementById('learn-status');
            var btnEl = document.getElementById('learn-btn');
            if (btnEl) btnEl.style.display = 'none';
            if (statusEl) {
              statusEl.textContent = '🚀 ' + (data.statusMessage || '训练中...');
              statusEl.style.color = '#3fb950';
            }

            var els = ['learn-progress','progress-text','iter-info','score-info','best-info','time-info'];
            for (var i = 0; i < els.length; i++) {
              var el = document.getElementById(els[i]);
              if (el) el.style.display = '';
            }

            var pt = document.getElementById('progress-text');
            var pb = document.getElementById('progress-bar');
            var ii = document.getElementById('iter-info');
            var si = document.getElementById('score-info');
            var bi = document.getElementById('best-info');
            var ti = document.getElementById('time-info');
            if (pt) pt.textContent = Math.round(data.progress * 100) + '%';
            if (pb) pb.style.width = (data.progress * 100) + '%';
            if (ii) ii.textContent = data.currentIteration + '/' + data.totalIterations;
            if (si) si.textContent = (data.currentEvalScore || 0).toFixed(4);
            if (bi) bi.textContent = (data.bestScore || 0).toFixed(4);
            if (ti) ti.textContent = formatTime(data.elapsedSeconds || 0);

            startStatusPolling();
          })
          .catch(function(e) {
            console.log('[learn-ui] No running task to restore');
          });
        }

        function startLearning() {
          var btn = document.getElementById('learn-btn');
          var stopBtn = document.getElementById('stop-btn');
          if (btn) btn.style.display = 'none';
          if (stopBtn) stopBtn.style.opacity = '1';

          var statusEl = document.getElementById('learn-status');
          if (!statusEl) return;
          statusEl.textContent = '正在启动训练...';
          statusEl.style.color = '#f0d060';

          var payload;
          if (currentMode === 'selfplay') {
            payload = { matchesPerEval: 200, iterations: 100, mode: 'selfplay', aiType: currentAiType };
          } else if (currentMode === 'genetic') {
            payload = { matchesPerEval: 30, iterations: 10, populationSize: 20, mode: 'genetic', aiType: currentAiType };
          } else {
            payload = { iterations: 20, mode: 'record', aiType: currentAiType };
          }

          var url = '/api/v1/learn';
          console.log('[learn-ui] Starting learning:', currentMode, payload);

          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'same-origin'
          })
          .then(function(response) {
            console.log('[learn-ui] Response status:', response.status);
            if (!response.ok) {
              throw new Error('HTTP error: ' + response.status);
            }
            return response.json();
          })
          .then(function(data) {
            console.log('[learn-ui] Response data:', data);
            if (data.ok) {
              statusEl.textContent = '训练已启动';
              statusEl.style.color = '#3fb950';
              var els = ['learn-progress','progress-text','iter-info','score-info','best-info','time-info'];
              for (var i = 0; i < els.length; i++) {
                var el = document.getElementById(els[i]);
                if (el) el.style.display = '';
              }
              startStatusPolling();
            } else {
              statusEl.textContent = '❌ ' + data.message;
              statusEl.style.color = '#e8444e';
              if (btn) btn.style.display = '';
            }
          })
          .catch(function(e) {
            console.error('[learn-ui] Error:', e);
            statusEl.textContent = '❌ 请求失败: ' + e.message;
            statusEl.style.color = '#e8444e';
            if (btn) btn.style.display = '';
          });
        }

        function stopLearning() {
          var statusEl = document.getElementById('learn-status');
          if (statusEl) {
            statusEl.textContent = '正在停止训练...';
            statusEl.style.color = '#f0d060';
          }
          var stopBtn = document.getElementById('stop-btn');
          if (stopBtn) stopBtn.style.opacity = '0.4';

          fetch('/api/v1/learn/stop', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (statusEl) {
              statusEl.textContent = data.message;
              statusEl.style.color = 'rgba(255,255,255,0.5)';
            }
          });
        }

        function startStatusPolling() {
          if (statusInterval) clearInterval(statusInterval);
          statusInterval = setInterval(function() {
            fetch('/api/v1/learn/status')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var statusEl = document.getElementById('learn-status');
              if (!statusEl) return;

              if (!data.isRunning) {
                clearInterval(statusInterval);
                var btnEl = document.getElementById('learn-btn');
                if (btnEl) btnEl.style.display = '';

                var msg = data.statusMessage || '';
                if (msg.indexOf('completed') >= 0) {
                  statusEl.textContent = '✅ ' + msg;
                  statusEl.style.color = '#3fb950';
                } else if (msg.indexOf('stopped') >= 0) {
                  statusEl.textContent = '⏹️ ' + msg;
                  statusEl.style.color = '#f0d060';
                } else {
                  statusEl.textContent = '❌ ' + (msg || 'Unknown');
                  statusEl.style.color = '#e8444e';
                }
              } else {
                statusEl.textContent = '🚀 ' + (data.statusMessage || '训练中...');
                statusEl.style.color = '#3fb950';
              }

              var pt = document.getElementById('progress-text');
              var pb = document.getElementById('progress-bar');
              var ii = document.getElementById('iter-info');
              var si = document.getElementById('score-info');
              var bi = document.getElementById('best-info');
              var ti = document.getElementById('time-info');
              if (pt) pt.textContent = Math.round(data.progress * 100) + '%';
              if (pb) pb.style.width = (data.progress * 100) + '%';
              if (ii) ii.textContent = data.currentIteration + '/' + data.totalIterations;
              if (si) si.textContent = (data.currentEvalScore || 0).toFixed(4);
              if (bi) bi.textContent = (data.bestScore || 0).toFixed(4);
              if (ti) ti.textContent = formatTime(data.elapsedSeconds || 0);
            })
            .catch(function(e) {
              console.error('Polling error:', e);
            });
          }, 1500);
        }

        function formatTime(seconds) {
          var mins = Math.floor(seconds / 60);
          var secs = seconds % 60;
          if (mins > 0) {
            return mins + '分' + secs + '秒';
          }
          return secs + '秒';
        }

        function isInGameRoom() {
          // Primary: URL path check
          if (window.location.pathname.indexOf('/tables/') >= 0) return true;
          // Secondary: requires BOTH sessionStorage AND DOM evidence
          var tableId = sessionStorage.getItem('td');
          var hasGameContainer = document.querySelector('.game-container, [class*="game-container"], #game-container');
          var hasSeatCard = document.querySelector('.seat-card, [class*="seat-card"]');
          // Only consider in-room if sessionStorage has td AND DOM has game elements
          return (tableId && tableId.length > 0) && !!(hasGameContainer || hasSeatCard);
        }

        var closeTimeout = null;

        function checkLobby() {
          var inRoom = isInGameRoom();
          if (inRoom && learnPanel) {
            // Debounce: wait 800ms to confirm before closing (prevents flicker during SPA transitions)
            if (!closeTimeout) {
              closeTimeout = setTimeout(function() {
                if (isInGameRoom() && learnPanel) {
                  console.log('[learn-ui] Closing panel (in game room)');
                  closeLearnPanel();
                }
                closeTimeout = null;
              }, 800);
            }
          } else if (!inRoom && !learnPanel) {
            if (closeTimeout) {
              clearTimeout(closeTimeout);
              closeTimeout = null;
            }
            console.log('[learn-ui] Creating panel (in lobby)');
            createLearnPanel();
          }
        }

        // Initial checks with staggered timing
        setTimeout(checkLobby, 300);
        setTimeout(checkLobby, 800);
        setTimeout(checkLobby, 1500);
        setTimeout(checkLobby, 3000);

        // Continuous monitoring every 2 seconds
        lobbyInterval = setInterval(checkLobby, 2000);

        console.log('[learn-ui] ready');
      })();
    </script>
    <script>
      (function(){
        console.log('[guard] init');
        var _gsLastResponse=Date.now(),_gsUnstickCount=0,_gsGameClosed=false,_gsCleanedUp=false;
        var _gsOrigFetch=window.fetch;
        window.fetch=function(){
          var p=_gsOrigFetch.apply(this,arguments);
          var url=typeof arguments[0]==='string'?arguments[0]:arguments[0]&&arguments[0].url||'';
          if(url.indexOf('/nextstate')>=0||url.indexOf('/tables')>=0){
            var m=url.match(/\/tables\/([^\/\?]+)/);
            if(m){
              var tid=m[1];
              _gsLastResponse=Date.now();
              _gsGameClosed=false;
              _gsCleanedUp=false;
              sessionStorage.setItem('td',tid);
              console.log('[guard] tableId stored:',tid);
            } else {
              _gsLastResponse=Date.now();
              _gsUnstickCount=0;
            }
            p.then(function(){_gsLastResponse=Date.now();_gsUnstickCount=0}).catch(function(){});
          }
          return p;
        };

        function onGameClosed(){
          var tid=sessionStorage.getItem('td');
          if(!tid||_gsCleanedUp)return;
          _gsGameClosed=true;
          console.log('[guard] game closed, will cleanup table:',tid);
        }

        function doCleanup(tid){
          if(_gsCleanedUp)return;
          _gsCleanedUp=true;
          console.log('[guard] cleaning up table:',tid);
          fetch('/kb.php?table_id='+encodeURIComponent(tid),{keepalive:true}).catch(function(){});
          sessionStorage.removeItem('td');
        }

        function checkStuck(){
          var tid=sessionStorage.getItem('td');
          if(!tid||_gsCleanedUp)return;
          var now=Date.now();
          if(_gsGameClosed && now-_gsLastResponse>5000){
            doCleanup(tid);
            return;
          }
          if(now-_gsLastResponse>15000){
            _gsUnstickCount++;
            console.warn('[guard] stuck #'+_gsUnstickCount);
            fetch('/unstick.php?table_id='+encodeURIComponent(tid)).then(function(r){return r.json()}).then(function(d){if(d&&d.ok)_gsLastResponse=Date.now()}).catch(function(){});
            if(_gsUnstickCount>=5){console.warn('[guard] reload');location.reload()}
          }
        }
        setInterval(checkStuck,3000);

        new MutationObserver(function(muts){
          for(var i=0;i<muts.length;i++){
            var removed=muts[i].removedNodes;
            if(removed.length>0){
              for(var j=0;j<removed.length;j++){
                var node=removed[j];
                if(node.nodeType===1){
                  var html=node.outerHTML||node.textContent||'';
                  if(html.indexOf('game-container')>=0||html.indexOf('seat-card')>=0){
                    console.log('[guard] game component removed from DOM');
                    setTimeout(onGameClosed,800);
                    return;
                  }
                }
              }
            }
          }
        }).observe(document.getElementById('root')||document.body,{childList:true,subtree:true});

        window.addEventListener('beforeunload',function(){
          var tid=sessionStorage.getItem('td');
          if(tid&&_gsGameClosed&&!_gsCleanedUp){
            console.log('[guard] beforeunload cleanup:',tid);
            fetch('/kb.php?table_id='+encodeURIComponent(tid),{keepalive:true}).catch(function(){});
          }
          sessionStorage.removeItem('td');
        });

        console.log('[guard] ready');
      })();
    </script>

    <button id="fs-btn" title="全屏" style="display:none;margin-left:4px;width:28px;height:28px;border:none;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;align-items:center;justify-content:center;line-height:1;padding:0;">⛶</button>
    <script>
      (function(){
        console.log('[fullscreen] init');
        var btn = document.getElementById('fs-btn');
        if (!btn) { console.log('[fullscreen] btn not found!'); return; }

        var isFS = false;
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          if (!isFS) {
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
            // 进入全屏后尝试锁定横屏
            setTimeout(function() {
              try {
                if (screen.orientation && screen.orientation.lock) {
                  screen.orientation.lock('landscape').catch(function(){});
                } else if (screen.lockOrientation) {
                  screen.lockOrientation('landscape');
                } else if (screen.mozLockOrientation) {
                  screen.mozLockOrientation('landscape');
                } else if (screen.msLockOrientation) {
                  screen.msLockOrientation('landscape');
                }
              } catch(e2) {}
            }, 100);
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
          }
        });
        document.addEventListener('fullscreenchange', function(){ isFS = !!document.fullscreenElement; });
        document.addEventListener('webkitfullscreenchange', function(){ isFS = !!document.webkitFullscreenElement; });
        document.addEventListener('msfullscreenchange', function(){ isFS = !!document.msFullscreenElement; });

        var attached = false;
        function tryInject() {
          if (attached) return;
          // 找"退出"按钮
          var allBtns = document.querySelectorAll('button');
          var exitBtn = null;
          for (var i = 0; i < allBtns.length; i++) {
            if (allBtns[i].textContent === '退出') {
              exitBtn = allBtns[i];
              break;
            }
          }
          if (!exitBtn) return;
          var parent = exitBtn.parentElement;
          if (!parent) return;
          parent.appendChild(btn);
          btn.style.display = 'inline-flex';
          attached = true;
          console.log('[fullscreen] injected into topbar-r');
        }
        setInterval(tryInject, 600);
        setTimeout(tryInject, 300);
        setTimeout(tryInject, 1000);
        setTimeout(tryInject, 2000);
        tryInject();

        // React 重渲染后重新注入
        var obs = new MutationObserver(function() {
          if (attached && !btn.parentElement) {
            attached = false;
            tryInject();
          }
        });

        function parseCard(str) {
          if (!str) return null;
          if (/^(🃏|SJ|sJ|🃏b|🃏B)$/.test(str)) return {suit:"JOKER",rank:"小",isRed:false,isJoker:true};
          if (/^(👑|BJ|bJ|🃏R|🃏r)$/.test(str)) return {suit:"JOKER",rank:"大",isRed:true,isJoker:true};
          var m = str.match(/^([\u2660\u2665\u2666\u2663♠♥♦♣])([2-9]|10|[JQKAjqka])$/);
          if (m) {
            var e = m[1], u = m[2].toUpperCase();
            var n = "S";
            if (e === "♠" || e === "S") n = "S";
            else if (e === "♥" || e === "H") n = "H";
            else if (e === "♦" || e === "D") n = "D";
            else if (e === "♣" || e === "C") n = "C";
            return {suit: n, rank: u, isRed: n==="H"||n==="D", isJoker: false};

          var m2 = str.match(/^([SHDC])([2-9]|10|[JQKAjqka])$/i);

            var n2 = m2[1].toUpperCase();

          return null;
        }

        function getLevel() {
          // 优先从手牌区域的 React 状态中读取 handLevel（当前手牌的级牌）

          var handLevel = getHandLevelFromReact();
          if (handLevel) return handLevel;

          // Fallback: 从 DOM 读取玩家队伍级别
          var el = document.querySelector('.my-team .score-level-num');
          if (el) {
            var txt = el.textContent.trim().toUpperCase();
            var num = parseInt(txt);
            if (num === 11) return 'J';
            if (num === 12) return 'Q';
            if (num === 13) return 'K';
            if (num === 14 || num === 1) return 'A';
            if (!isNaN(num) && num >= 2 && num <= 10) return '' + num;
            return txt;
          }
          return '2';
        }

        function getHandLevelFromReact() {
          // 从 React fiber 树中读取 handLevel
          var handArea = document.querySelector('.hand-cards-area');

          if (!fk) return null;

            var hook = fiber.memoizedState;
            while (hook) {

                var hl = hook.memoizedState.handLevel;
                if (typeof hl === 'string') return hl;
                if (typeof hl === 'number') return '' + hl;
              }
              var base = hook.memoizedState;
              if (base && base.hand && base.hand.handLevel) {
                var hl2 = base.hand.handLevel;
                if (typeof hl2 === 'string') return hl2;
                if (typeof hl2 === 'number') return '' + hl2;
              }
              hook = hook.next;
            }
          }
          return null;
        }

        function findAllStraightFlushes(suit) {
          var levelRank = getLevel();
          var slots = document.querySelectorAll('.vert-card-slot');
          var suitCards = [];
          var wildSlotIdx = -1;

          for (var i = 0; i < slots.length; i++) {
            var cardEl = slots[i].querySelector('.card');
            if (!cardEl) continue;
            var cardStr = cardEl.getAttribute('title') || '';
            var idx = parseInt(slots[i].getAttribute('data-card-idx'));
            if (isNaN(idx)) continue;

            var card = parseCard(cardStr);
            if (!card) continue;

            if (card.rank === levelRank && card.suit === "H" && !card.isJoker) {
              wildSlotIdx = idx;
              continue;

              var sel = [];
              for (var r2 = start; r2 < start + 5; r2++) {
                if (rankSet.has(r2)) {
                  for (var k = 0; k < suitCards.length; k++) {

              }
            }

          for (var start = 2; start <= 10; start++) {

          }

          var hasAce = rankSet.has(14);
          var low4 = [2,3,4,5];

          if (hasAce && hasLow) {
            var sel = [];
            for (var r3 = 2; r3 <= 5; r3++) {
              for (var k = 0; k < suitCards.length; k++) {

                  sel.push(suitCards[k].idx); break;
                }

                }
              }
              if (sel.length === 5) wildResults.push(sel);
            }

            results: naturalResults.concat(wildResults),

        function updateHighlights() {

        function clickCards(cardIdxs) {
          console.log('[suit-btn] clickCards', JSON.stringify(cardIdxs));
          var handArea = document.querySelector('.hand-cards-area');
          if (!handArea) return;

          var fiberKey = Object.keys(handArea).find(function(k) { return k.indexOf('__reactFiber') === 0; });
          if (!fiberKey) return;
          var nvFiber = handArea[fiberKey].return;
          if (nvFiber && nvFiber.memoizedState) {
            var refHook = nvFiber.memoizedState.next;
            if (refHook && refHook.memoizedState && refHook.memoizedState.current) {
              refHook.memoizedState.current.wasDrag = false;

          }

          if (dispatch) {
            dispatch(function(prev) { return cardIdxs; });
            return;
          }

          var cl = nvFiber && nvFiber.memoizedProps && nvFiber.memoizedProps.onCardClick;
          if (cl && cl.toString().replace(/\s/g, '').length >= 15) {
            var currentSel = nvFiber.memoizedProps.selectedIndices || [];
            for (var i = 0; i < currentSel.length; i++) cl(currentSel[i]);

        function findSelectedDispatch(handArea) {
          if (!handArea) return null;
          var fk = Object.keys(handArea).find(function(k) { return k.indexOf('__reactFiber') === 0; });
          if (!fk) return null;
          var nvFiber = handArea[fk].return;
          if (!nvFiber) return null;

          function hasSelectedIndicesChild(f) {
            if (!f) return false;
            var ch = f.child;
            while (ch) {
              if (ch.memoizedProps && ch.memoizedProps.selectedIndices !== undefined) return true;
              if (hasSelectedIndicesChild(ch)) return true;
              ch = ch.sibling;
            }

          }

          var fiber = nvFiber;
          for (var level = 0; level < 20 && fiber; level++) {
            fiber = fiber.return;
            if (!fiber || !fiber.memoizedState) continue;
            if (!hasSelectedIndicesChild(fiber)) continue;
            var hook = fiber.memoizedState;
            while (hook) {
              if (hook.queue && hook.queue.dispatch && Array.isArray(hook.memoizedState)) {
                var st = hook.memoizedState;
                if (st.length === 0 || typeof st[0] === 'number') return hook.queue.dispatch;
              }
              hook = hook.next;
            }

          var rootEl = document.getElementById('root');
          var rk = Object.keys(rootEl).find(function(k) { return k.indexOf('__reactContainer') === 0; });
          if (rk) {
            var rf = rootEl[rk];
            if (rf._internalRoot) rf = rf._internalRoot.current;
            if (rf.current) rf = rf.current;
            if (rf.stateNode === rootEl) rf = rf.child;
            var r = _searchFiber(rf);
            if (r) return r;
          }
          return null;
        }
        function _searchFiber(f) {
          if (!f) return null;
          if (f.memoizedState) {
            var hook = f.memoizedState;
            while (hook) {
              if (hook.queue && hook.queue.dispatch && Array.isArray(hook.memoizedState)) {
                var st = hook.memoizedState;
                if (st.length === 0 || typeof st[0] === 'number') return hook.queue.dispatch;
              }
              hook = hook.next;
            }
          }
          return _searchFiber(f.child) || _searchFiber(f.sibling);
        }

        function tryInject() {
          var actionBar = document.querySelector('.action-bar');
          if (!actionBar) { injected = false; return; }
          var playBtns = actionBar.querySelectorAll('button');
          var hasPlayBtn = false;
          for (var i = 0; i < playBtns.length; i++) {
            var txt = playBtns[i].textContent || '';
            if (txt.indexOf('出牌') >= 0 || txt.indexOf('不出') >= 0) {
              hasPlayBtn = true; break;
            }
          }
          if (!hasPlayBtn) {
            injected = false;
            if (wrapper && wrapper.parentNode) wrapper.style.display = 'none';
            return;
          }
          if (injected) {
            if (wrapper && wrapper.parentNode) {
              wrapper.style.display = '';
              updateHighlights();
              return;
            }
            injected = false;
            suitCycleIndex = {};
          }
          if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
          wrapper = document.createElement('span');
          wrapper.className = 'suit-btn-wrapper';
          wrapper.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin-left:8px';
          var suitInlineStyles = {
            'S': 'color:#fff!important;border-color:#222!important;background:#333!important',
            'H': 'color:#fff!important;border-color:#cc2233!important;background:#cc2233!important',
            'C': 'color:#fff!important;border-color:#222!important;background:#333!important',
            'D': 'color:#fff!important;border-color:#cc2233!important;background:#cc2233!important'
          };
          var baseStyle = 'display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%;font-size:24px;cursor:pointer;border:2px solid;line-height:1;margin:0 2px;vertical-align:middle;font-family:Segoe UI Symbol,Apple Symbols,Arial Unicode MS,sans-serif;';
          for (var s = 0; s < SUITS.length; s++) {
            var btn = document.createElement('button');
            btn.className = 'suit-btn ' + SUITS[s].cls;
            btn.title = SUITS[s].title;
            btn.innerHTML = SUITS[s].svg;
            btn.style.cssText = baseStyle + suitInlineStyles[SUITS[s].suit];
            btn.setAttribute('data-suit', SUITS[s].suit);
            (function(suit){
              btn.addEventListener('click', function(e){
                e.preventDefault();
                e.stopPropagation();

                var data = findAllStraightFlushes(suit);
                if (!data || data.results.length === 0) return;

                var results = data.naturalCount > 0 ? data.results.slice(0, data.naturalCount) : data.results;

                var handArea = document.querySelector('.hand-cards-area');
                var dispatch = findSelectedDispatch(handArea);
                if (!dispatch) return;

                var idx = suitCycleIndex[suit] || 0;

                if (idx >= results.length) {
                  suitCycleIndex[suit] = 0;
                  dispatch(function(prev) { return []; });
                  return;
                }

                var targetIdxs = results[idx];
                suitCycleIndex[suit] = idx + 1;

                dispatch(function(prev) { return targetIdxs; });
              });
            })(SUITS[s].suit);
            wrapper.appendChild(btn);
          }
          var indicator = actionBar.querySelector('.waiting-indicator');
          if (indicator) {
            actionBar.insertBefore(wrapper, indicator);
          } else {
            actionBar.appendChild(wrapper);
          }
          injected = true;
          console.log('[suit-btn] injected into action-bar');
          updateHighlights();
          updateCenterButtons();
        }

        createCenterPanel();
        var observer = new MutationObserver(function(){ tryInject(); updateCenterButtons(); });
        observer.observe(document.body || document.documentElement, {childList: true, subtree: true});
        setInterval(function(){ tryInject(); updateCenterButtons(); }, 1000);
        setTimeout(function(){ tryInject(); updateCenterButtons(); }, 500);
        setTimeout(updateCenterButtons, 2000);
        console.log('[suit-btn] injector ready');
        } catch(e) {
          console.error('[suit-btn] FATAL ERROR:', e.message, e.stack);
        }
      })();

      }
      .gxp-sub { margin-top: 10px; font-size: 17px; color: #cdd6f4; }
      .gxp-restart {
        display: inline-block; margin-top: 18px; padding: 9px 22px;
        border-radius: 999px; font-size: 15px; color: #101528; font-weight: 700;
        background: linear-gradient(90deg,#ffd76e,#ffb347);
        box-shadow: 0 4px 18px rgba(255,190,70,.45);
      }
      @keyframes gxp-pop {
        0% { transform: scale(.55); opacity: 0; }
        62% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); }
      }
      @keyframes gxp-bounce {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      .gxp-confetti {
        position: absolute; top: -24px; width: 10px; height: 16px;
        border-radius: 2px; opacity: .95; pointer-events: none;
        animation: gxp-fall linear forwards;
      }
      @keyframes gxp-fall {
        to { transform: translateY(108vh) rotate(720deg); opacity: .85; }
      }
    </style>
    <script>
      (function () {
        'use strict';
        var _gxpOrigFetch = window.fetch;
        var _gxpLastKey = null;

        function teamName(id) {
          return id === 'team_EW' ? 'EW（东西组）' : 'SN（南北组）';
        }

        function spawnConfetti(box) {
          var colors = ['#ffd76e','#ff8fab','#7ee787','#79c0ff','#d2a8ff','#ffa657'];
          for (var i = 0; i < 42; i++) {
            var p = document.createElement('div');
            p.className = 'gxp-confetti';
            p.style.left = Math.random() * 100 + '%';
            p.style.background = colors[i % colors.length];
            p.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
            p.style.animationDelay = (Math.random() * 1.6) + 's';
            p.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
            box.appendChild(p);
          }
        }

        function showChampion(winnerId, reason) {
          try {
            if (document.getElementById('gxp-overlay')) return;
            var ov = document.createElement('div');
            ov.id = 'gxp-overlay';
            var failLine = reason === 'aceFail'
              ? '<div class="gxp-sub" style="color:#ff9b9b">💥 对方冲击A级三战失败（本场失败）</div>'
              : '<div class="gxp-sub">A级双上 · 完成本场制胜</div>';
            ov.innerHTML =
              '<div class="gxp-card">' +
                '<div class="gxp-trophy">🏆</div>' +
                '<div class="gxp-title">' + teamName(winnerId) + ' 获胜！</div>' +
                failLine +
                '<div class="gxp-restart">🎉 新一场即将开始：双方从 2 级重新对战！</div>' +
              '</div>';
            document.body.appendChild(ov);
            spawnConfetti(ov);
            requestAnimationFrame(function () { ov.classList.add('gxp-show'); });
            var close = function () {
              ov.classList.remove('gxp-show');
              setTimeout(function () { ov.remove(); }, 250);
            };
            ov.addEventListener('click', close);
            setTimeout(close, 9000); // 展示9秒后自动关闭
            console.log('[champ-overlay] champion shown:', winnerId);
          } catch (e) { console.error('[champ-overlay]', e); }
        }

        // /snapshot: {...tableState}；/nextstate: { delta:{ops:[{op,path,value}]}, seq }
        // 两种响应形态都要兼容，否则长轮询永远读不到 scoreboard
        function extractState(data) {
          if (!data || typeof data !== 'object') return null;
          if (data.scoreboard) return data;
          if (data.state && data.state.scoreboard) return data.state;
          var ops = data.delta && data.delta.ops;
          if (ops && ops.length) {
            var partial = null;
            for (var i = 0; i < ops.length; i++) {
              var o = ops[i];
              if (!o || typeof o.path !== 'string') continue;
              if (o.path === '/scoreboard' && o.value && typeof o.value === 'object') {
                return { scoreboard: o.value };
              }
              var v = o.value;
              if (v && typeof v === 'object' && v.scoreboard) return v;
              // /nextstate 的细粒度补丁：/scoreboard/gameWinnerTeamId、/scoreboard/lastChampionship 等
              if (o.path.indexOf('/scoreboard/') === 0) {
                var sub = o.path.slice('/scoreboard/'.length);
                if (sub.indexOf('/') < 0) {
                  partial = partial || {};
                  partial[sub] = o.value;
                }
              }
            }
            if (partial && ('gameWinnerTeamId' in partial || 'lastChampionship' in partial)) {
              return { scoreboard: partial };
            }
          }
          return null;
        }

        function inspect(data) {
          try {
            var st = extractState(data);
            var sc = st && st.scoreboard;
            if (!sc || !sc.gameWinnerTeamId) return;
            var champ = sc.lastChampionship || {};
            // 新鲜度：仅展示90秒内的冠军事件，避免迟到客户端弹出历史战报
            if (champ.at && Date.now() - champ.at > 90000) return;
            var key = (champ.at != null ? 'at:' + champ.at : 'seq:' + (champ.seq || data.seq || 0)) +
                      '|' + sc.gameWinnerTeamId;
            if (key === _gxpLastKey) return;
            _gxpLastKey = key;
            showChampion(sc.gameWinnerTeamId, champ.reason || 'champion');
          } catch (e) { console.error('[champ-overlay] inspect', e); }
      }

        // 拦截轮询响应，检测夺冠标记（scoreboard 随状态暴露）
        window.fetch = function () {
          var args = arguments;
          var url = String((args[0] && args[0].url) || args[0] || '');
          return _gxpOrigFetch.apply(this, arguments).then(function (resp) {
            try {
              if (url.indexOf('/api/') >= 0 || url.indexOf('/tables') >= 0 ||
                  url.indexOf('/ping') < 0) {
                resp.clone().json().then(inspect).catch(function () {});
              }
            } catch (e) {}
            return resp;
          });
        };

        console.log('[champ-overlay] ready');
      })();
    </script>
</body>
</html>
